<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="pi-plugin-chrome" content="v3"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; connect-src 'none'"><title>Litterbox 文件托管</title>
<style>body{margin:0;padding:64px 28px 28px;font:14px system-ui;color:#e5e7eb;background:#151a22}h1{font-size:23px}p{color:#aeb9ca;line-height:1.7}label{display:block;margin:20px 0 8px}input,select,button,textarea{box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #435065;background:#232c3a;color:inherit;font:inherit}input,textarea{width:100%}button{cursor:pointer;margin:18px 8px 0 0}button:disabled{opacity:.5;cursor:default}#status{white-space:pre-wrap;overflow-wrap:anywhere}textarea{height:72px}</style></head>
<body><h1>Litterbox 临时文件托管</h1><p>上传文件生成公网直链，任何持有链接的人均可访问。托管上限 1 GB；Gemini 外链媒体每次合计最多 100 MB。</p><form id="form"><label for="path">本地文件路径</label><input id="path" required placeholder="E:\Videos\clip.mp4"><label for="expiration">保留时间</label><select id="expiration"><option value="1h">1 小时</option><option value="12h">12 小时</option><option value="24h" selected>24 小时</option><option value="72h">72 小时</option></select><div><button id="upload">上传文件</button><button id="cancel" type="button" disabled>取消</button></div></form><p id="status" role="status">也可以在对话中让智能体调用 upload_file，上传结果会自动接入 Gemini 媒体上下文。</p><div id="result" hidden><textarea id="url" readonly aria-label="文件链接"></textarea><button id="copy">复制链接</button><p>面板上传只生成链接；需要模型直接理解素材时，请在对话中调用上传工具。</p></div><script src="app.js"></script></body></html>
