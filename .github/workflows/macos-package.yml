name: macOS 与 Windows 打包

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 发布为 GitHub 预发布版本
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/macos-package.yml

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: 统一构建版本
    runs-on: ubuntu-latest
    outputs:
      time: ${{ steps.stamp.outputs.time }}
      version: ${{ steps.stamp.outputs.version }}
      display: ${{ steps.stamp.outputs.display }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: stamp
        name: 生成北京时间版本
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { buildStamp } from './scripts/prepare-build.mjs';
          const stamp = buildStamp();
          appendFileSync(process.env.GITHUB_OUTPUT, `time=${stamp.builtAt}\nversion=${stamp.version}\ndisplay=${stamp.displayVersion}\n`);
          NODE

  build:
    name: macOS ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      THIS_IS_A_AGENT_BUILD_TIME: ${{ needs.version.outputs.time }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 设置产物目录
        run: echo "THIS_IS_A_AGENT_OUTPUT_DIR=$RUNNER_TEMP/macos-package" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 配置 Rust
        run: |
          rustup default stable
          rustc --version
          cargo --version
      - name: 原生编译并生成 DMG
        run: |
          node -e "if(process.arch !== '${{ matrix.arch }}') throw new Error('runner 架构不匹配: '+process.arch)"
          pnpm --filter @pi-desktop/desktop dist:mac
      - name: 检查架构并整理下载文件
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app=$(find "$THIS_IS_A_AGENT_OUTPUT_DIR" -maxdepth 3 -name 'this-is-a-agent.app' -type d -print -quit)
          test -n "$app"
          native_arch="$EXPECTED_ARCH"
          if [ "$native_arch" = x64 ]; then native_arch=x86_64; fi
          lipo "$app/Contents/MacOS/this-is-a-agent" -verify_arch "$native_arch"
          lipo "$app/Contents/Resources/bin/pi-desktop-host-core" -verify_arch "$native_arch"
          mkdir -p "$RUNNER_TEMP/downloads"
          find "$THIS_IS_A_AGENT_OUTPUT_DIR" -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) -exec cp {} "$RUNNER_TEMP/downloads/" \;
          find "$THIS_IS_A_AGENT_OUTPUT_DIR" -type f -name 'latest-mac*.yml' -exec cp {} "$RUNNER_TEMP/downloads/latest-mac-$EXPECTED_ARCH.yml" \;
          test -f "$RUNNER_TEMP/downloads/this-is-a-agent-${{ needs.version.outputs.display }}-$EXPECTED_ARCH.dmg"
          node scripts/mac-update-feed.mjs export "$RUNNER_TEMP/downloads/mac-update-$EXPECTED_ARCH.json" "$RUNNER_TEMP/downloads/latest-mac-$EXPECTED_ARCH.yml"
          for dmg in "$RUNNER_TEMP/downloads/"*.dmg; do hdiutil verify "$dmg"; done
          cd "$RUNNER_TEMP/downloads"
          shasum -a 256 *.dmg *.zip > "SHA256SUMS-$EXPECTED_ARCH.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-${{ needs.version.outputs.display }}
          path: ${{ runner.temp }}/downloads/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      THIS_IS_A_AGENT_BUILD_TIME: ${{ needs.version.outputs.time }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 设置产物目录
        run: '"THIS_IS_A_AGENT_OUTPUT_DIR=$env:RUNNER_TEMP\windows-package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: pnpm/action-setup@v6
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 配置 Rust
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
      - name: 原生编译并生成安装版和便携版
        run: pnpm --filter @pi-desktop/desktop dist:win
      - name: 整理下载文件与校验信息
        env:
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP 'downloads'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          Get-ChildItem -LiteralPath $env:THIS_IS_A_AGENT_OUTPUT_DIR -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' -and $_.DirectoryName -notmatch 'win-unpacked' } |
            Copy-Item -Destination $downloadDir
          foreach ($name in @("this-is-a-agent-Setup-$env:DISPLAY_VERSION-x64.exe", "this-is-a-agent-Portable-$env:DISPLAY_VERSION-x64.exe", 'latest.yml')) {
            if (-not (Test-Path -LiteralPath (Join-Path $downloadDir $name))) { throw "缺少构建产物：$name" }
          }
          Get-ChildItem -LiteralPath $downloadDir -Filter '*.exe' |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content -LiteralPath (Join-Path $downloadDir 'SHA256SUMS-windows-x64.txt') -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-${{ needs.version.outputs.display }}
          path: ${{ runner.temp }}/downloads/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: 发布安装包下载
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [version, build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-${{ needs.version.outputs.display }}'
          path: downloads
          merge-multiple: true
      - name: 创建桌面预发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          DISPLAY_VERSION: ${{ needs.version.outputs.display }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f "downloads/this-is-a-agent-$DISPLAY_VERSION-arm64.dmg"
          test -f "downloads/this-is-a-agent-$DISPLAY_VERSION-x64.dmg"
          test -f "downloads/this-is-a-agent-Setup-$DISPLAY_VERSION-x64.exe"
          test -f "downloads/this-is-a-agent-Portable-$DISPLAY_VERSION-x64.exe"
          node scripts/mac-update-feed.mjs merge downloads/latest-mac.yml downloads/mac-update-arm64.json downloads/mac-update-x64.json
          rm downloads/mac-update-arm64.json downloads/mac-update-x64.json
          test -f "downloads/latest-mac.yml"
          test -f "downloads/latest.yml"
          test -s docs/RELEASE-NOTES.md
          cat docs/RELEASE-NOTES.md > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<EOF

          ## 下载选择

          - macOS：M 系列选择 arm64.dmg；Intel 选择 x64.dmg。
          - Windows：安装版选择 Setup-x64.exe；单文件便携版选择 Portable-x64.exe。

          源码版本：$SOURCE_SHA
          EOF
          gh release create "v$BUILD_VERSION" downloads/* \
            --target "$SOURCE_SHA" \
            --title "这是一个助手 $DISPLAY_VERSION · macOS / Windows" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
          gh release view "v$BUILD_VERSION" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
