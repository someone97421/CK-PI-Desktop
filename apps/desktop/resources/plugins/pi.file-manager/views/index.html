<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>File Manager</title>
    <style>
      .cm-editor .cm-panel.cm-search .cm-textfield{border:1px solid var(--border-strong);border-radius:3px;background:var(--surface);color:var(--fg);caret-color:var(--fg)}
      .cm-editor .cm-panel.cm-search .cm-textfield::placeholder{color:var(--muted)}
      .cm-editor .cm-panel.cm-search .cm-button{border:1px solid var(--border-strong);border-radius:3px;background:var(--surface-hover);color:var(--fg)}
      .cm-editor .cm-panel.cm-search .cm-button:hover:not(:disabled){background:var(--surface-active)}
    </style>
    <script src="./assets/index.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
